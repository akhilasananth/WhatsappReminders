name: Reminders Workflow
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '29 16 * * *'
      timezone: 'America/New_York'
jobs:
  send_reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pipenv'
      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv
      - name: Install dependencies
        run: |
          pipenv install
          pipenv graph
      - name: Run main
        env:
          REMINDER_DUE_PARAM : ${{ vars.REMINDER_DUE_PARAM }}
          REMINDER_SUBJECT_PARAM : ${{ vars.REMINDER_SUBJECT_PARAM }}
          REMINDER_ADDITIONAL_MESSAGE : ${{ vars.REMINDER_ADDITIONAL_MESSAGE }}
          WHATSAPP_API_URL : ${{ secrets.WHATSAPP_API_URL }}
          WHATSAPP_API_KEY : ${{ secrets.WHATSAPP_API_KEY }}
          WHATSAPP_CHAT_ID : ${{ secrets.WHATSAPP_CHAT_ID }}
          REMINDERS: ${{ vars.REMINDERS }}
        run: |
          pipenv run python src/main.py
